<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veille Fiscale · Comptabilité · Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen p-6 font-sans">
    <div class="max-w-7xl mx-auto">
        <!-- En-tête -->
        <header class="mb-6 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                📂 Veille Fiscalité · Comptabilité · Audit
            </h1>
            <p class="text-xs text-slate-400 mt-1">Dashboard MVP — Synthèse automatique des sources officielles françaises via Gemini AI</p>
        </header>

        <!-- Filtres et Recherche -->
        <div class="mb-6 flex flex-wrap gap-3 items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-800">
            <div class="flex gap-2 overflow-x-auto">
                <button onclick="filtrerCat('Toutes')" class="cat-btn bg-white text-slate-900 px-3 py-1.5 rounded-lg text-xs font-semibold">Toutes</button>
                <button onclick="filtrerCat('Fiscalité')" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold">Fiscalité</button>
                <button onclick="filtrerCat('Comptabilité')" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold">Comptabilité</button>
                <button onclick="filtrerCat('Audit')" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold">Audit</button>
            </div>
            <input type="text" id="searchInput" onkeyup="filtrer()" placeholder="Rechercher (TVA, IS, BNC...)..." 
                   class="bg-slate-950 border border-slate-800 text-xs text-slate-200 px-3 py-2 rounded-lg outline-none focus:border-blue-500 w-full sm:w-64">
        </div>

        <!-- Grille des articles -->
        <div id="articlesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-slate-500 text-sm">Chargement des flux...</p>
        </div>
    </div>

    <script>
        let tousLesArticles = [];
        let categorieActive = 'Toutes';

        async function chargerVeille() {
            try {
                const res = await fetch('data.json');
                tousLesArticles = await res.json();
                afficherArticles(tousLesArticles);
            } catch (err) {
                document.getElementById('articlesContainer').innerHTML = `<p class="text-amber-500 text-sm">Aucune donnée chargée. Lancez le workflow GitHub Actions pour générer le premier flux.</p>`;
            }
        }

        function afficherArticles(list) {
            const container = document.getElementById('articlesContainer');
            if (!list || list.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-sm col-span-2">Aucune actualité trouvée pour cette sélection.</p>`;
                return;
            }

            container.innerHTML = list.map(item => `
                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex flex-col justify-between hover:border-slate-700 transition shadow-lg">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="bg-blue-950 text-blue-400 border border-blue-800/50 text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded">
                                ${item.categorie || 'Général'}
                            </span>
                            <span class="text-[11px] text-slate-500">${item.source || 'Source officielle'}</span>
                        </div>
                        <h2 class="text-sm font-semibold text-slate-100 mb-2 line-clamp-2">
                            <a href="${item.lien}" target="_blank" class="hover:text-blue-400 transition">${item.titre}</a>
                        </h2>
                        <p class="text-xs text-slate-400 mb-3 line-clamp-3">${item.resume || ''}</p>
                    </div>
                    ${item.impact_pratique ? `
                        <div class="bg-slate-950/80 border-l-2 border-amber-500 p-2.5 rounded-r text-[11px] text-slate-300 mt-2">
                            <strong class="text-amber-400">Impact :</strong> ${item.impact_pratique}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function filtrerCat(cat) {
            categorieActive = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.innerText === cat) {
                    btn.className = "cat-btn bg-white text-slate-900 px-3 py-1.5 rounded-lg text-xs font-semibold";
                } else {
                    btn.className = "cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold";
                }
            });
            filtrer();
        }

        function filtrer() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const resultat = tousLesArticles.filter(item => {
                const matchQuery = (item.titre + ' ' + (item.resume || '')).toLowerCase().includes(query);
                const matchCat = categorieActive === 'Toutes' || (item.categorie && item.categorie.includes(categorieActive));
                return matchQuery && matchCat;
            });
            afficherArticles(resultat);
        }

        chargerVeille();
    </script>
</body>
</html>
